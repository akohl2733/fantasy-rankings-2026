  db:
    image: postgres:15-alpine
    container_name: fantasy_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-fantasy}
    ports:
      - "5432:5432"
    # networks:
    #   - app-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    # networks:
    #   - app-network
    volumes:
      - ./backend:/app
    depends_on:
      - db
    
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    user: "root"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - HOSTNAME=0.0.0.0
    # networks:
    #   - app-network
    volumes:
      - ./frontend:/app
      - /app/.next
      - /app/node_modules
    depends_on:
      - backend

# networks:
#   app-network:
#     driver: bridge

volumes:
  postgres_data:
